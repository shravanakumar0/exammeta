[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

# Netlify sets CI=true, which makes Create React App treat ESLint warnings as
# build errors. Keep warnings visible in the log without failing the deploy.
[build.environment]
  CI = "false"
  # Supabase's anon key is a public client key that Create React App inlines
  # into the browser bundle by design, so secret scanning must not flag it.
  SECRETS_SCAN_OMIT_KEYS = "REACT_APP_SUPABASE_ANON_KEY"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/hackathons"
  to = "/.netlify/functions/hackathons"
  status = 200

[[redirects]]
  from = "/api/internships"
  to = "/.netlify/functions/internships"
  status = 200

[[redirects]]
  from = "/api/gemini"
  to = "/.netlify/functions/gemini"
  status = 200

